name: CI - Integración Continua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instalación de dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecución de pruebas
      - name: Ejecutar pruebas unitarias
        run: npm test

      # 5. Validación del proyecto - construir imagen Docker
      - name: Construir imagen Docker
        run: docker build -t devops-u2-app:${{ github.sha }} .

      # 6. Escaneo de seguridad con Trivy
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-u2-app:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 7. Publicar imagen en Docker Hub (solo en push a main)
      - name: Login a Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen en Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag devops-u2-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-u2-app:${{ github.sha }}
          docker tag devops-u2-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-u2-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-u2-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-u2-app:latest
